<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM REQUEST PR ENGINEERING</title>
    <style>
        /* Reset & Base */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
        }

        /* Body dengan Background Gambar & Flexbox Layout */
        body { 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            color: #334155;
            background: url('https://static.vecteezy.com/system/resources/previews/003/386/349/large_2x/machine-gears-background-free-photo.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        
        /* Container Card dengan Efek Transparansi (Responsif) */
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: rgba(255, 255, 255, 0.9) !important; 
            backdrop-filter: blur(8px); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin: auto;
        }
        
        h2 { text-align: center; color: #0f172a; margin-bottom: 8px; font-size: 22px; }
        .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 25px; }

        /* Form Elements */
        .form-group { margin-bottom: 18px; position: relative; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #475569; }
        
        input, textarea, select { 
            width: 100%; 
            max-width: 100%;
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #cbd5e1; 
            background: #f8fafc; 
            font-size: 16px; /* Mencegah auto-zoom di iOS */
            transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus { 
            background: #fff; 
            border-color: #2563eb; 
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); 
            outline: none; 
        }
        input[readonly] { background: #e2e8f0; color: #475569; cursor: not-allowed; }

        /* Button */
        .btn { 
            width: 100%; 
            padding: 12px; 
            background: #2563eb; 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer;
            transition: background 0.2s; 
            margin-top: 10px;
        }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #94a3b8; }

        /* Autocomplete / Suggestions Box */
        .suggestions-box { 
            position: absolute; 
            width: 100%; 
            background: #fff; 
            border: 1px solid #cbd5e1; 
            border-top: none; 
            max-height: 200px; 
            overflow-y: auto; 
            display: none; 
            z-index: 999; 
            border-radius: 0 0 8px 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .suggestion-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
        .suggestion-item:hover, .suggestion-item.active { background: #eff6ff; }
        .suggestion-name { font-weight: 600; font-size: 14px; }
        .suggestion-code { font-size: 11px; color: #64748b; }
        mark { background: #ffe082; padding: 0 2px; }

        /* Footer responsif */
        .footer {
            padding: 15px;
            text-align: center;
            color: white;
            font-size: 11px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            width: 100%;
            margin-top: 20px;
        }

        /* Loading Spinner Animation */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Media query untuk HP */
        @media (max-width: 480px) {
            .container { padding: 20px; border-radius: 12px; }
            h2 { font-size: 18px; }
            .btn { padding: 15px; } 
        }
    </style>
</head>

<body>
    <div id="pageLoader" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:9999; display:flex; justify-content:center; align-items:center; flex-direction:column;">
        <div style="border:5px solid #f3f3f3; border-top:5px solid #2563eb; border-radius:50%; width:50px; height:50px; animation:spin 1s linear infinite;"></div>
        <p style="margin-top:15px; font-weight:bold; color:#2563eb;">Memuat Database...</p>
    </div>

    <div class="container">
        <h2>FORM REQUEST PR ENGINEERING</h2>
        <div class="subtitle">Sistem Internal Permintaan Barang & Sparepart</div>

        <form id="prForm">
            <div class="form-group">
                <label>Nama Karyawan</label>
                <input type="text" name="nama" required>
            </div>
            <div class="form-group">
                <label>Grup / Nonshift</label>
                <select name="grup" required>
                    <option value="" disabled selected>-- Pilih --</option>
                    <option>Group A</option> 
                    <option>Group B</option> 
                    <option>Group C</option> 
                    <option>Group D</option> 
                    <option>Nonshift</option>
                </select>
            </div>
            <div class="form-group">
                <label>Departemen</label>
                <input type="text" name="departemen" value="Engineering" readonly>
            </div>
            <div class="form-group">
                <label>Nama Barang / Sparepart</label>
                <input type="text" id="barangInput" name="barang" autocomplete="off" required>
                <div id="suggestions" class="suggestions-box"></div>
            </div>
            <div class="form-group">
                <label>Kode Barang</label>
                <input type="text" id="kodeInput" name="kode">
            </div>
            <div class="form-group">
                <label>Jumlah Barang</label>
                <input type="number" name="jumlah" min="1" step="1" required>
            </div>
            <div class="form-group">
                <label>Keterangan Kebutuhan</label>
                <textarea name="keterangan" required></textarea>
            </div>
            <div class="form-group">
                <label>Untuk Mesin</label>
                <input type="text" name="mesin" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Kirim Request PR</button>
        </form>
    </div>

    <footer class="footer">
        &copy; 2026 Departemen Engineering - Sistem PR Internal
    </footer>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const barangInput = document.getElementById('barangInput');
    const kodeInput = document.getElementById('kodeInput');
    const suggestionsBox = document.getElementById('suggestions');
    const form = document.getElementById('prForm');
    const submitBtn = document.getElementById('submitBtn');
    const loader = document.getElementById('pageLoader');

    const scriptURL = "https://script.google.com/macros/s/AKfycbxek8os1feQ0zocHA1e-Y-2wVKAMs8zj54gT5c88KUjsreKV3b1HHcRdLZsMKNWC25B/exec";

    let databaseBarang = [];

    if (!barangInput || !kodeInput || !suggestionsBox || !form || !submitBtn) {
        console.error("Elemen HTML tidak ditemukan.");
        return;
    }

    // Escape karakter regex
    function escapeRegex(text) {
        return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Load database
    async function loadBarang() {
        try {
            const res = await fetch(`${scriptURL}?action=getBarang`);

            if (!res.ok) {
                throw new Error(`HTTP ${res.status}`);
            }

            const data = await res.json();

            if (Array.isArray(data)) {
                databaseBarang = data;
            } else {
                console.error("Format data tidak valid:", data);
            }

        } catch (error) {
            console.error("Gagal memuat database:", error);

            if (loader) {
                loader.innerHTML = "<p style='color:red; font-weight:bold;'>Gagal memuat data. Silakan refresh halaman.</p>";
            }
        } finally {
            if (loader && databaseBarang.length > 0) {
                loader.style.display = "none";
            }
        }
    }

    loadBarang();
	// Search & Autocomplete Logic
    let selectedIndex = -1;
    let searchTimer;

    // Search dengan ranking
    function searchBarang(keyword) {
        const terms = keyword
            .toLowerCase()
            .trim()
            .split(/\s+/);

        return databaseBarang
            .map(item => {
                const nama = (item.nama || '').toLowerCase();
                const kode = (item.kode || '').toLowerCase();
                const fullText = `${nama} ${kode}`;

                const matchAllWords = terms.every(term => fullText.includes(term));
                if (!matchAllWords) return null;

                let score = 0;

                // Prioritas kode
                if (kode.startsWith(keyword)) score += 100;
                else if (kode.includes(keyword)) score += 50;

                // Prioritas nama
                if (nama.startsWith(keyword)) score += 30;
                else if (nama.includes(keyword)) score += 10;

                // Bonus setiap kata cocok
                terms.forEach(term => {
                    if (kode.includes(term)) score += 20;
                    if (nama.includes(term)) score += 10;
                });

                return { item, score };
            })
            .filter(Boolean)
            .sort((a, b) => b.score - a.score)
            .map(x => x.item);
    }

    // Input search event
    barangInput.addEventListener('input', function () {
        clearTimeout(searchTimer);
        const keyword = this.value.trim();

        // Reset input kode ketika user mengetik ulang nama barang
        kodeInput.value = '';
        selectedIndex = -1;

        if (!keyword) {
            suggestionsBox.style.display = 'none';
            return;
        }

        searchTimer = setTimeout(() => {
            const results = searchBarang(keyword);
            renderSuggestions(results, keyword);
        }, 250);
    });

    // Render hasil ke UI
    function renderSuggestions(results, keyword) {
        suggestionsBox.innerHTML = '';

        const terms = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').trim().split(/\s+/);
        const regex = new RegExp(`(${terms.join('|')})`, 'gi');

        // 1. Tampilkan info jumlah data jika ada hasil
        if (results.length > 0) {
            const totalResult = results.length;
            const infoDiv = document.createElement('div');
            infoDiv.style.cssText = "padding: 8px 12px; font-size: 11px; color: #94a3b8; border-bottom: 1px solid #f1f5f9; background: #f8fafc; font-weight: 500;";
            infoDiv.textContent = `${totalResult} data ditemukan`;
            suggestionsBox.appendChild(infoDiv);

            // Tampilkan maksimal 100 data
            results.slice(0, 100).forEach((item, index) => {
                const nama = item.nama || '';
                const kode = item.kode || '';

                const highlightedNama = nama.replace(regex, '<mark>$1</mark>');
                const highlightedKode = kode.replace(regex, '<mark>$1</mark>');

                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `
                    <div class="suggestion-name">${highlightedNama}</div>
                    <div class="suggestion-code">${highlightedKode}</div>
                `;

                div.addEventListener('click', () => {
                    barangInput.value = nama;
                    kodeInput.value = kode;
                    kodeInput.readOnly = true; // Kunci kembali jika pilih dari db
                    suggestionsBox.style.display = 'none';
                    selectedIndex = -1;
                });

                suggestionsBox.appendChild(div);
            });
        }

        // 2. TAMBAHKAN PILIHAN BARANG BARU (Selalu muncul di paling bawah / jika data tidak ditemukan)
        const newBarangDiv = document.createElement('div');
        newBarangDiv.className = 'suggestion-item';
        newBarangDiv.style.cssText = "background: #fffbeb; border-top: 1px dashed #fcd34d;"; // Warna kekuningan sebagai penanda
        newBarangDiv.innerHTML = `
            <div class="suggestion-name" style="color: #b45309;">✨ Gunakan "${keyword}" sebagai Barang Baru</div>
            <div class="suggestion-code" style="color: #d97706;">Klik untuk mengisi manual kode barang</div>
        `;

        newBarangDiv.addEventListener('click', () => {
            barangInput.value = keyword;
            kodeInput.value = ''; // Kosongkan agar diisi manual
            kodeInput.placeholder = "Isi kode manual / ketik 'BARANG BARU'";
            kodeInput.readOnly = false; // Buka proteksi readonly agar bisa diketik
            kodeInput.focus();
            suggestionsBox.style.display = 'none';
            selectedIndex = -1;
        });

        suggestionsBox.appendChild(newBarangDiv);
        suggestionsBox.style.display = 'block';
    }

    // Navigasi via Keyboard (Up, Down, Enter)
    barangInput.addEventListener('keydown', function (e) {
        const items = suggestionsBox.querySelectorAll('.suggestion-item');
        if (!items.length) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
        } 
        else if (e.key === 'ArrowUp') {
            e.preventDefault();
            selectedIndex = Math.max(selectedIndex - 1, 0);
        } 
        else if (e.key === 'Enter') {
            if (selectedIndex >= 0) {
                e.preventDefault();
                items[selectedIndex].click();
            }
        }

        // Terapkan kelas active & pastikan otomatis ter-scroll ke area pandang
        items.forEach((item, index) => {
            const isActive = index === selectedIndex;
            item.classList.toggle('active', isActive);
            if (isActive) {
                item.scrollIntoView({ block: 'nearest' });
            }
        });
    });

   // Handle Form Submit
    form.addEventListener('submit', async function (e) {
        e.preventDefault();

        // UBAH: Jika kode barang kosong karena user memilih/mengetik barang baru, 
        // otomatis isi dengan "BARANG BARU" agar tidak diblokir oleh validasi.
        if (!kodeInput.value.trim()) {
            kodeInput.value = "BARANG BARU";
        }

        submitBtn.disabled = true;
        const originalText = submitBtn.textContent;
        submitBtn.textContent = "Mengirim...";

        try {
            const response = await fetch(scriptURL, {
                method: 'POST',
                body: new FormData(form)
            });

            const text = await response.text();
            console.log("RAW RESPONSE:", text);

            let result;
            try {
                result = JSON.parse(text);
            } catch (err) {
                throw new Error("Server tidak mengirim format JSON yang valid.");
            }

            if (!response.ok) {
                throw new Error("Server error HTTP: " + response.status);
            }

            if (result.result !== "success") {
                throw new Error(result.message || "Gagal menyimpan data ke sistem.");
            }

            alert("Data Request PR berhasil dikirim.");
            
            // Reset Form & State setelah sukses
            form.reset();
            kodeInput.value = '';
            kodeInput.placeholder = ''; // Bersihkan placeholder manual jika ada
            kodeInput.readOnly = true;  // TAMBAHAN: Kunci kembali input kode barang menjadi readonly
            suggestionsBox.innerHTML = '';
            suggestionsBox.style.display = 'none';

        } catch (error) {
            console.error("SUBMIT ERROR:", error);
            alert(error.message || "Terjadi kesalahan saat mengirim data.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        }
    });

    // Tutup suggestion box saat klik di luar area input / box
    document.addEventListener('click', (e) => {
        if (!barangInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
            suggestionsBox.style.display = 'none';
        }
    });

});
</script>
</body>
</html>
