<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM REQUEST PR ENGINEERING</title>
    <style>
        /* Reset & Base */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
        }

        /* Body dengan Background Gambar & Flexbox Layout */
        body { 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            color: #334155;
            background: url('https://static.vecteezy.com/system/resources/previews/003/386/349/large_2x/machine-gears-background-free-photo.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        
        /* Container Card dengan Efek Transparansi (Responsif) */
        .container { 
            width: 100%; 
            max-width: 550px; 
            background: rgba(255, 255, 255, 0.9) !important; 
            backdrop-filter: blur(8px); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin: auto;
        }
        
        h2 { text-align: center; color: #0f172a; margin-bottom: 8px; font-size: 22px; }
        .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 25px; }

        /* Form Elements */
        .form-group { margin-bottom: 18px; position: relative; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #475569; }
        
        input, textarea, select { 
            width: 100%; 
            max-width: 100%;
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #cbd5e1; 
            background: #f8fafc; 
            font-size: 16px; /* Mencegah auto-zoom di iOS */
            transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus { 
            background: #fff; 
            border-color: #2563eb; 
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); 
            outline: none; 
        }
        input[readonly] { background: #e2e8f0; color: #475569; cursor: not-allowed; }

        /* Button */
        .btn { 
            width: 100%; 
            padding: 12px; 
            background: #2563eb; 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer;
            transition: background 0.2s; 
            margin-top: 10px;
        }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }

        /* Autocomplete / Suggestions Box */
        .suggestions-box { 
            position: absolute; 
            width: 100%; 
            background: #fff; 
            border: 1px solid #cbd5e1; 
            border-top: none; 
            max-height: 200px; 
            overflow-y: auto; 
            display: none; 
            z-index: 999; 
            border-radius: 0 0 8px 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .suggestion-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; text-align: left; }
        .suggestion-item:hover, .suggestion-item.active { background: #eff6ff; }
        .suggestion-name { font-weight: 600; font-size: 14px; }
        .suggestion-code { font-size: 11px; color: #64748b; }
        mark { background: #ffe082; padding: 0 2px; }

        /* Page Loader Styling */
        #pageLoader {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(255,255,255,0.9); 
            z-index: 9999; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column;
        }
        .spinner {
            border: 5px solid #f3f3f3; 
            border-top: 5px solid #2563eb; 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 1s linear infinite;
        }
        .loader-text {
            margin-top: 15px; 
            font-weight: bold; 
            color: #2563eb;
        }

        /* Styling Tabel Daftar Barang */
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 5px; border-radius: 8px; border: 1px solid #cbd5e1; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
        th, td { padding: 10px; border: 1px solid #cbd5e1; text-align: left; }
        th { background: #f1f5f9; color: #475569; font-weight: 600; }
        
        /* Action Buttons */
        .action-btns { display: flex; gap: 4px; justify-content: center; }
        .btn-action { border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; color: white; font-size: 12px; }
        .btn-edit { background: #f59e0b; }
        .btn-edit:hover { background: #d97706; }
        .btn-delete { background: #ef4444; }
        .btn-delete:hover { background: #dc2626; }

        /* CUSTOM ALERT NOTIFICATION MODAL STYLING */
        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .custom-modal {
            background: #ffffff;
            width: 90%;
            max-width: 400px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-icon {
            width: 56px; height: 56px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; margin: 0 auto 16px auto;
        }
        .modal-icon.success { background: #dcfce7; color: #16a34a; }
        .modal-icon.error { background: #fee2e2; color: #dc2626; }
        .modal-icon.warning { background: #fef3c7; color: #d97706; }
        .modal-title { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
        .modal-message { font-size: 14px; color: #64748b; line-height: 1.5; margin-bottom: 20px; }
        .modal-btn {
            width: 100%; padding: 10px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .modal-btn.success { background: #16a34a; color: white; }
        .modal-btn.success:hover { background: #15803d; }
        .modal-btn.error { background: #dc2626; color: white; }
        .modal-btn.error:hover { background: #b91c1c; }
        .modal-btn.warning { background: #d97706; color: white; }
        .modal-btn.warning:hover { background: #b45309; }

        /* Footer responsif */
        .footer {
            padding: 15px;
            text-align: center;
            color: white;
            font-size: 11px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            width: 100%;
            margin-top: 20px;
        }

        /* Loading Spinner Animation */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Media query untuk HP */
        @media (max-width: 480px) {
            .container { padding: 20px; border-radius: 12px; }
            h2 { font-size: 18px; }
            .btn { padding: 15px; } 
        }
    </style>
</head>

<body>
    <!-- Page Loader -->
    <div id="pageLoader">
        <div class="spinner"></div>
        <p class="loader-text">Memuat Database...</p>
    </div>

    <!-- Custom Alert Modal Structure -->
    <div id="customAlertModal" class="custom-modal-overlay">
        <div class="custom-modal">
            <div id="modalIcon" class="modal-icon">✔</div>
            <div id="modalTitle" class="modal-title">Notifikasi</div>
            <div id="modalMessage" class="modal-message">Pesan notifikasi di sini.</div>
            <button id="modalCloseBtn" class="modal-btn">Oke</button>
        </div>
    </div>

    <div class="container">
        <h2>FORM REQUEST PR ENGINEERING</h2>
        <div class="subtitle">Sistem Internal Permintaan Barang & Sparepart</div>

        <form id="prForm">
            <!-- Data Identitas Pemohon -->
            <div class="form-group">
                <label for="namaInput">Nama Karyawan</label>
                <input type="text" id="namaInput" name="nama" required>
            </div>
            
            <div class="form-group">
                <label for="grupSelect">Grup / Nonshift</label>
                <select id="grupSelect" name="grup" required>
                    <option value="" disabled selected>-- Pilih --</option>
                    <option value="Group A">Group A</option> 
                    <option value="Group B">Group B</option> 
                    <option value="Group C">Group C</option> 
                    <option value="Group D">Group D</option> 
                    <option value="Nonshift">Nonshift</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="deptInput">Departemen</label>
                <input type="text" id="deptInput" name="departemen" value="Engineering" readonly>
            </div>
            
            <hr style="border: 1px dashed #cbd5e1; margin: 25px 0;">

            <!-- AREA INPUT BARANG -->
            <div style="background: #f8fafc; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px;">
                <strong style="font-size: 14px; display:block; margin-bottom: 12px; color: #1e293b;" id="inputAreaTitle">📍 Input Detail Barang:</strong>
                
                <div class="form-group">
                    <label for="barangInput">Nama Barang / Sparepart</label>
                    <input type="text" id="barangInput" autocomplete="off">
                    <div id="suggestions" class="suggestions-box"></div>
                </div>
                
                <div class="form-group">
                    <label for="kodeInput">Kode Barang</label>
                    <input type="text" id="kodeInput" readonly placeholder="Otomatis terisi">
                </div>
                
                <div class="form-group">
                    <label for="jumlahInput">Jumlah Barang</label>
                    <input type="number" id="jumlahInput" min="1" step="1" oninput="this.value = !!this.value && Math.abs(this.value) >= 1 ? Math.floor(Math.abs(this.value)) : null">
                </div>
                
                <div class="form-group">
                    <label for="keteranganInput">Keterangan Kebutuhan</label>
                    <textarea id="keteranganInput" rows="2"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="mesinInput">Untuk Mesin</label>
                    <input type="text" id="mesinInput">
                </div>
                
                <div style="display: flex; gap: 8px;">
                    <button type="button" id="addBarangBtn" class="btn" style="background: #059669; margin-top: 5px;">➕ Tambah ke Daftar</button>
                    <button type="button" id="cancelEditBtn" class="btn" style="background: #64748b; margin-top: 5px; display: none;">Batal</button>
                </div>
            </div>

            <!-- TABEL KERANJANG DAFTAR BARANG -->
            <div class="form-group">
                <label>Daftar Permintaan Barang Saat Ini: <span id="itemCount" style="color:#2563eb; font-weight:bold;">(0/15)</span></label>
                <div class="table-responsive">
                    <table id="barangTable">
                        <thead>
                            <tr>
                                <th>Barang</th>
                                <th>Kode</th>
                                <th>Qty</th>
                                <th>Mesin</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr id="emptyRow"><td colspan="5" style="text-align: center; padding: 15px; color: #94a3b8;">Belum ada barang di dalam daftar.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- BUTTON SUBMIT UTAMA -->
            <button type="submit" class="btn" id="submitBtn" disabled>Kirim Request PR</button>
        </form>
    </div>

    <footer class="footer">
        &copy; 2026 Departemen Engineering - Sistem PR Internal
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const barangInput = document.getElementById('barangInput');
        const kodeInput = document.getElementById('kodeInput');
        const jumlahInput = document.getElementById('jumlahInput');
        const keteranganInput = document.getElementById('keteranganInput');
        const mesinInput = document.getElementById('mesinInput');
        const namaInput = document.getElementById('namaInput');
        const grupSelect = document.getElementById('grupSelect');
        
        const suggestionsBox = document.getElementById('suggestions');
        const form = document.getElementById('prForm');
        const submitBtn = document.getElementById('submitBtn');
        const addBarangBtn = document.getElementById('addBarangBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const inputAreaTitle = document.getElementById('inputAreaTitle');
        const itemCount = document.getElementById('itemCount');
        const barangTableBody = document.querySelector('#barangTable tbody');
        const emptyRow = document.getElementById('emptyRow');
        const loader = document.getElementById('pageLoader');

        // Elemen Modal Alert Custom
        const alertModal = document.getElementById('customAlertModal');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        const scriptURL = "https://script.google.com/macros/s/AKfycbxek8os1feQ0zocHA1e-Y-2wVKAMs8zj54gT5c88KUjsreKV3b1HHcRdLZsMKNWC25B/exec";

        let databaseBarang = [];
        let listBarangRequest = []; 
        let selectedIndex = -1;
        let editingIndex = -1; // Indeks barang yang sedang di-edit
        let searchTimer;
        const MAX_ITEMS = 15; // Limitasi jumlah barang (Opsi 5)

        // FUNGSI UNTUK MENAMPILKAN CUSTOM ALERT MODAL
        function showAlert(type, title, message) {
            modalIcon.className = `modal-icon ${type}`;
            modalCloseBtn.className = `modal-btn ${type}`;
            
            if (type === 'success') modalIcon.innerHTML = '✔';
            else if (type === 'error') modalIcon.innerHTML = '✖';
            else if (type === 'warning') modalIcon.innerHTML = '⚠';

            modalTitle.textContent = title;
            modalMessage.textContent = message;

            alertModal.style.display = 'flex';
            setTimeout(() => {
                alertModal.style.opacity = '1';
                alertModal.querySelector('.custom-modal').style.transform = 'scale(1)';
            }, 10);
        }

        // FUNGSI UNTUK MENUTUP MODAL (OPSI 5: Tentukan Event Esc & Overlay)
        function closeModal() {
            alertModal.style.opacity = '0';
            alertModal.querySelector('.custom-modal').style.transform = 'scale(0.9)';
            setTimeout(() => { alertModal.style.display = 'none'; }, 300);
        }

        modalCloseBtn.addEventListener('click', closeModal);
        alertModal.addEventListener('click', (e) => { if (e.target === alertModal) closeModal(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && alertModal.style.display === 'flex') closeModal();
        });

        // OPSI 4: AUTO-SAVE LOCALSTORAGE (Simpan dan Muat Draft)
        function saveDraft() {
            const draftData = {
                nama: namaInput.value,
                grup: grupSelect.value,
                items: listBarangRequest
            };
            localStorage.setItem('pr_form_draft', JSON.stringify(draftData));
        }

        function loadDraft() {
            const savedDraft = localStorage.getItem('pr_form_draft');
            if (savedDraft) {
                try {
                    const draft = JSON.parse(savedDraft);
                    if (draft.nama) namaInput.value = draft.nama;
                    if (draft.grup) grupSelect.value = draft.grup;
                    if (Array.isArray(draft.items) && draft.items.length > 0) {
                        listBarangRequest = draft.items;
                        renderTable();
                    }
                } catch (e) {
                    console.error("Gagal membaca draft:", e);
                }
            }
        }

        namaInput.addEventListener('input', saveDraft);
        grupSelect.addEventListener('change', saveDraft);

        function escapeRegex(text) {
            return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Load database barang dari Google Apps Script
        async function loadBarang() {
            try {
                if (loader) loader.style.display = "flex"; 
                const res = await fetch(`${scriptURL}?action=getBarang`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const data = await res.json();
                if (Array.isArray(data)) databaseBarang = data;
            } catch (error) {
                console.error("Gagal memuat database:", error);
                if (loader) {
                    loader.innerHTML = "<p style='color:red; font-weight:bold; text-align:center; padding:10px;'>Gagal memuat data. Silakan refresh halaman.</p>";
                }
            } finally {
                if (loader && loader.innerHTML.indexOf("Gagal") === -1) {
                    loader.style.display = "none";
                }
            }
        }

        loadBarang();
        loadDraft(); // Load draft dari localStorage saat startup

        // Algoritma Search Autocomplete
        function searchBarang(keyword) {
            const terms = keyword.toLowerCase().trim().split(/\s+/);
            return databaseBarang
                .map(item => {
                    const nama = (item.nama || '').toLowerCase();
                    const kode = (item.kode || '').toLowerCase();
                    const fullText = `${nama} ${kode}`;

                    const matchAllWords = terms.every(term => fullText.includes(term));
                    if (!matchAllWords) return null;

                    let score = 0;
                    if (kode.startsWith(keyword)) score += 100;
                    else if (kode.includes(keyword)) score += 50;
                    if (nama.startsWith(keyword)) score += 30;
                    else if (nama.includes(keyword)) score += 10;

                    return { item, score };
                })
                .filter(Boolean)
                .sort((a, b) => b.score - a.score)
                .map(x => x.item);
        }

        barangInput.addEventListener('input', function () {
            clearTimeout(searchTimer);
            const keyword = this.value.trim();
            kodeInput.value = '';
            selectedIndex = -1;

            if (!keyword) {
                suggestionsBox.style.display = 'none';
                return;
            }

            searchTimer = setTimeout(() => {
                const results = searchBarang(keyword);
                renderSuggestions(results, keyword);
            }, 250);
        });

        function renderSuggestions(results, keyword) {
            suggestionsBox.innerHTML = '';
            const escapedKeyword = escapeRegex(keyword.trim());
            const terms = escapedKeyword.split(/\s+/);
            const regex = new RegExp(`(${terms.join('|')})`, 'gi');

            if (results.length > 0) {
                const infoDiv = document.createElement('div');
                infoDiv.style.cssText = "padding: 8px 12px; font-size: 11px; color: #94a3b8; border-bottom: 1px solid #f1f5f9; background: #f8fafc; font-weight: 500;";
                infoDiv.textContent = `${results.length} data ditemukan`;
                suggestionsBox.appendChild(infoDiv);

                results.slice(0, 100).forEach((item) => {
                    const nama = item.nama || '';
                    const kode = item.kode || '';
                    const highlightedNama = nama.replace(regex, '<mark>$1</mark>');
                    const highlightedKode = kode.replace(regex, '<mark>$1</mark>');

                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `
                        <div class="suggestion-name">${highlightedNama}</div>
                        <div class="suggestion-code">${highlightedKode}</div>
                    `;

                    div.addEventListener('click', () => {
                        barangInput.value = nama;
                        kodeInput.value = kode;
                        kodeInput.readOnly = true;
                        suggestionsBox.style.display = 'none';
                        selectedIndex = -1;
                    });
                    suggestionsBox.appendChild(div);
                });
            }

            const newBarangDiv = document.createElement('div');
            newBarangDiv.className = 'suggestion-item';
            newBarangDiv.style.cssText = "background: #fffbeb; border-top: 1px dashed #fcd34d;"; 
            newBarangDiv.innerHTML = `
                <div class="suggestion-name" style="color: #b45309;">✨ Gunakan "${keyword}" sebagai Barang Baru</div>
                <div class="suggestion-code" style="color: #d97706;">Klik untuk mengisi manual kode barang</div>
            `;

            newBarangDiv.addEventListener('click', () => {
                barangInput.value = keyword;
                kodeInput.value = ''; 
                kodeInput.placeholder = "Isi kode manual / ketik 'BARANG BARU'";
                kodeInput.readOnly = false;
                kodeInput.focus();
                suggestionsBox.style.display = 'none';
                selectedIndex = -1;
            });

            suggestionsBox.appendChild(newBarangDiv);
            suggestionsBox.style.display = 'block';
        }

        // Navigasi Keyboard Dropdown
        barangInput.addEventListener('keydown', function (e) {
            const items = suggestionsBox.querySelectorAll('.suggestion-item');
            if (!items.length) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedIndex = Math.max(selectedIndex - 1, 0);
            } else if (e.key === 'Enter') {
                if (selectedIndex >= 0) {
                    e.preventDefault();
                    items[selectedIndex].click();
                }
            }

            items.forEach((item, index) => {
                const isActive = index === selectedIndex;
                item.classList.toggle('active', isActive);
                if (isActive) item.scrollIntoView({ block: 'nearest' });
            });
        });

        // RESET INPUT BARANG FORM
        function resetItemForm() {
            barangInput.value = '';
            kodeInput.value = '';
            kodeInput.placeholder = 'Otomatis terisi';
            kodeInput.readOnly = true;
            jumlahInput.value = '';
            keteranganInput.value = '';
            mesinInput.value = '';
            
            editingIndex = -1;
            addBarangBtn.textContent = '➕ Tambah ke Daftar';
            addBarangBtn.style.background = '#059669';
            cancelEditBtn.style.display = 'none';
            inputAreaTitle.textContent = '📍 Input Detail Barang:';
        }

        // TAMBAH / UPDATE BARANG KE TABEL (OPSI 2 & 5)
        addBarangBtn.addEventListener('click', () => {
            const namaBarang = barangInput.value.trim();
            let kodeBarang = kodeInput.value.trim();
            const jumlah = jumlahInput.value.trim();
            const keterangan = keteranganInput.value.trim();
            const mesin = mesinInput.value.trim();

            if (!namaBarang || !jumlah || !keterangan || !mesin) {
                showAlert('warning', 'Data Belum Lengkap', 'Mohon lengkapi seluruh detail data barang terlebih dahulu!');
                return;
            }

            // Batas maksimal 15 item jika menambah barang baru
            if (editingIndex === -1 && listBarangRequest.length >= MAX_ITEMS) {
                showAlert('warning', 'Batas Maksimal Tercapai', `Maksimal permintaan per PR adalah ${MAX_ITEMS} barang.`);
                return;
            }

            if (!kodeBarang) kodeBarang = "BARANG BARU";

            const itemData = { namaBarang, kodeBarang, jumlah, keterangan, mesin };

            if (editingIndex >= 0) {
                listBarangRequest[editingIndex] = itemData; // Update item
            } else {
                listBarangRequest.push(itemData); // Tambah item baru
            }

            renderTable();
            saveDraft();
            resetItemForm();
            
            // OPSI 5: Focus kembali ke input nama barang
            barangInput.focus();
        });

        // BATAL EDIT ITEM
        cancelEditBtn.addEventListener('click', resetItemForm);

        function renderTable() {
            barangTableBody.innerHTML = '';
            itemCount.textContent = `(${listBarangRequest.length}/${MAX_ITEMS})`;
            
            if (listBarangRequest.length === 0) {
                barangTableBody.appendChild(emptyRow);
                submitBtn.disabled = true;
                return;
            }

            submitBtn.disabled = false;

            listBarangRequest.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.namaBarang}</td>
                    <td>${item.kodeBarang}</td>
                    <td>${item.jumlah}</td>
                    <td>${item.mesin}</td>
                    <td>
                        <div class="action-btns">
                            <button type="button" class="btn-action btn-edit" onclick="editBarang(${index})">✏️ Edit</button>
                            <button type="button" class="btn-action btn-delete" onclick="hapusBarang(${index})">❌</button>
                        </div>
                    </td>
                `;
                barangTableBody.appendChild(tr);
            });
        }

        // OPSI 2: EDIT BARANG
        window.editBarang = function(index) {
            const item = listBarangRequest[index];
            barangInput.value = item.namaBarang;
            kodeInput.value = item.kodeBarang;
            kodeInput.readOnly = (item.kodeBarang !== "BARANG BARU");
            jumlahInput.value = item.jumlah;
            keteranganInput.value = item.keterangan;
            mesinInput.value = item.mesin;

            editingIndex = index;
            addBarangBtn.textContent = '💾 Simpan Perubahan';
            addBarangBtn.style.background = '#f59e0b';
            cancelEditBtn.style.display = 'block';
            inputAreaTitle.textContent = `✏️ Edit Barang #${index + 1}:`;
            
            barangInput.focus();
        };

        window.hapusBarang = function(index) {
            if (editingIndex === index) resetItemForm();
            listBarangRequest.splice(index, 1);
            renderTable();
            saveDraft();
        };

        // SUBMIT FORM KE GOOGLE SHEETS BACKEND
        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            if (listBarangRequest.length === 0) {
                showAlert('warning', 'Daftar Kosong', 'Daftar barang belanja masih kosong!');
                return;
            }

            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = "Mengirim...";

            const payload = {
                nama: namaInput.value.trim(),
                grup: grupSelect.value,
                departemen: document.getElementById('deptInput').value,
                items: listBarangRequest
            };

            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });

                const text = await response.text();
                let result;
                try {
                    result = JSON.parse(text);
                } catch (err) {
                    throw new Error("Respon server tidak valid.");
                }

                if (result.result !== "success") {
                    throw new Error(result.message || "Gagal menyimpan data.");
                }

                // TAMPILKAN CUSTOM MODAL SUKSES
                showAlert('success', 'Berhasil Dikirim', 'Semua data Request PR Anda telah sukses tersimpan ke sistem!');
                
                // Clear Draft & Form setelah sukses
                listBarangRequest = [];
                localStorage.removeItem('pr_form_draft');
                renderTable();
                form.reset();
                resetItemForm();

            } catch (error) {
                console.error("SUBMIT ERROR:", error);
                showAlert('error', 'Gagal Mengirim', error.message || 'Terjadi masalah teknis saat pengiriman.');
            } finally {
                submitBtn.disabled = listBarangRequest.length === 0;
                submitBtn.textContent = originalText;
            }
        });

        document.addEventListener('click', (e) => {
            if (!barangInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.style.display = 'none';
            }
        });
    });
    </script>
</body>
</html>
